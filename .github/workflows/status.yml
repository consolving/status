name: status check

on:
  schedule:
    # Backup path only: GitHub drops the vast majority of scheduled events
    # for this repo (~4 of 48 per day, slot-independent). The primary check
    # runs on host1 via systemd timer and pushes data/, which triggers
    # deploy-on-push.yml. This workflow checks + commits; deploys happen via
    # deploy-on-push.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Dedupe schedule fires (run at most every ~15 min)
        id: dedupe
        run: |
          last=$(git log -1 --format=%cI -- data/)
          if [ -z "$last" ]; then
            echo "No history yet — running."
            exit 0
          fi
          last_ts=$(date -u -d "$last" +%s)
          now_ts=$(date -u +%s)
          age_min=$(( (now_ts - last_ts) / 60 ))
          echo "Last data commit: $last (${age_min} min ago)"
          if [ "$age_min" -lt 13 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check hosts and update history
        if: steps.dedupe.outputs.skip != 'true'
        env:
          HEALTH_STATUS_TOKEN: ${{ secrets.HEALTH_STATUS_TOKEN }}
        run: python3 scripts/check.py

      - name: Commit history
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git push origin HEAD; then
                break
              fi
              echo "push failed (attempt $i), rebasing"
              if [ "$i" = "3" ]; then
                exit 1
              fi
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
          fi
